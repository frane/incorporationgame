<body>
<div id="rotateHint">📱↺<br><br>Rotate your phone —<br>bureaucracy is best endured in landscape.</div>
<div id="wrap">
  <div id="stage" style="position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;">
    <canvas id="cv" width="960" height="600" tabindex="0"></canvas>
    <div id="titleUI" style="display:none;">
      <div class="lbl">Name your startup</div>
      <input id="coName" maxlength="24" value="Yolo" spellcheck="false">
      <button id="btnStart">Found it</button>
      <button id="btnCont" class="ghost" style="display:none;">Continue paperwork</button>
    </div>
    <div id="touchUI" style="display:none;">
      <div id="dpad">
        <div class="tb" data-k="arrowup"    style="grid-area:u;">▲</div>
        <div class="tb" data-k="arrowleft"  style="grid-area:l;">◀</div>
        <div class="tb" data-k="arrowright" style="grid-area:r;">▶</div>
        <div class="tb" data-k="arrowdown"  style="grid-area:d;">▼</div>
      </div>
      <div id="abtn" class="tb">E</div>
    </div>
  </div>
  <div id="foot">Arrows / WASD move &nbsp;·&nbsp; E / Space talk &nbsp;·&nbsp; M sound &nbsp;·&nbsp; made with ♥ and AI by <a href="https://x.com/fbandov" target="_blank" rel="noopener" style="color:#8a90a4;">@fbandov</a></div>
</div>
